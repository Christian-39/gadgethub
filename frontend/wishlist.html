<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo"><svg class="logo-svg" width="140" height="26" viewBox="0 0 150 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GadgetHub"><circle cx="8" cy="13" r="5" fill="#7c3aed"/><text x="20" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="currentColor">GadgetHub</text></svg></a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav"><!-- nav-injected --></nav>
    </aside>

    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/" class="mobile-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px;flex-shrink:0"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Wishlist</a>
        </div>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <div id="auth-links"></div>
        </div>
    </header>
    <div class="mobile-search-bar" id="mobile-search-bar">
        <input type="text" id="mobile-search-input" placeholder="Search products...">
        <button id="mobile-search-btn" aria-label="Search">🔍</button>
    </div>

    <main class="main-content">
        <h1>My Wishlist</h1>
        <div id="wishlist-grid" class="products-grid">
            <!-- JS populated -->
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav"><!-- nav-injected --></nav>

    <script type="module">
        import { App } from '/js/core/app.js';
        import { API, formatNaira, lazyLoadImages } from '/js/core/api.js';
        import { UI } from '/js/core/ui.js';

        class WishlistPage {
            static async init() {
                const container = document.getElementById('wishlist-grid');
                try {
                    const data = await API.get('/products/wishlist/');
                    const items = Array.isArray(data) ? data : (data.results || []);
                    
                    if (!items.length) {
                        container.innerHTML = `
                            <div class="empty-state" style="grid-column: 1 / -1;">
                                <h3>Your wishlist is empty</h3>
                                <p>Save items you love for later</p>
                                <a href="/products.html" class="btn-primary">Browse Products</a>
                            </div>`;
                        return;
                    }
                    
                    container.innerHTML = items.map(item => {
                        const p = item.product;
                        // p.images comes from ProductCache (via the wishlist
                        // serializer), which now consistently stores plain
                        // URL strings - not {url: "..."} objects.
                        const img = p.images?.[0] ? `https://payuee.com/image/${p.images[0]}` : '/assets/placeholder.jpg';
                        return `
                            <div class="product-card" data-id="${p.payuee_id}">
                                <div class="product-image">
                                    <img data-src="${img}" alt="${p.title}" class="lazy-img" loading="lazy" onerror="this.onerror=null;this.src='/assets/placeholder.jpg';this.classList.remove('lazy-img');">
                                    <button class="btn-wishlist active" data-id="${p.payuee_id}">❤</button>
                                </div>
                                <div class="product-info">
                                    <h3>${p.title}</h3>
                                    <p class="product-price">${formatNaira(p.selling_price)}</p>
                                    <p class="product-stock ${p.stock_status}">${p.stock_remaining} left</p>
                                </div>
                                <button class="btn-add-cart" data-id="${p.payuee_id}">Add to Cart</button>
                            </div>`;
                    }).join('');
                    
                    lazyLoadImages();
                    
                    container.querySelectorAll('.btn-wishlist').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            try {
                                await API.delete('/products/wishlist/', { product_id: parseInt(btn.dataset.id) });
                                btn.closest('.product-card').remove();
                                UI.showToast('Removed from wishlist', 'success');
                                App.updateCounts();
                            } catch (err) {
                                UI.showToast(err.message, 'error');
                            }
                        });
                    });
                    
                    container.querySelectorAll('.btn-add-cart').forEach(btn => {
                        btn.addEventListener('click', async (e) => {
                            e.stopPropagation();
                            try {
                                await API.post('/products/cart/', { product_id: parseInt(btn.dataset.id), quantity: 1 });
                                UI.showToast('Added to cart', 'success');
                                App.updateCounts();
                            } catch (err) {
                                UI.showToast(err.message, 'error');
                            }
                        });
                    });
                    
                    container.querySelectorAll('.product-card').forEach(card => {
                        card.addEventListener('click', (e) => {
                            if (!e.target.closest('button')) {
                                window.location.href = `/product-detail.html?id=${card.dataset.id}`;
                            }
                        });
                    });
                } catch (e) {
                    container.innerHTML = '<p class="error">Failed to load wishlist</p>';
                }
            }
        }

        App.init().then(() => WishlistPage.init());
    </script>
</body>
</html>
