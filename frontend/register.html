<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — GadgetHub</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="/" class="auth-logo">⚡ GadgetHub</a>
        <h2>Create Account</h2>
        <p>Join GadgetHub for secure shopping</p>
        
        <form id="register-form" class="auth-form">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="reg-first-name" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="reg-last-name" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="reg-email" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="reg-phone" placeholder="+234...">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" required minlength="8">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="reg-confirm" required>
            </div>
            <button type="submit" class="btn-primary btn-large btn-full">Create Account</button>
        </form>
        
        <div class="auth-links">
            <span>Already have an account?</span>
            <a href="/login.html">Sign in</a>
        </div>
    </div>

    <script type="module">
        import { Auth } from '/js/core/auth.js';
        import { UI } from '/js/core/ui.js';
        
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            
            if (pass !== confirm) {
                UI.showToast('Passwords do not match', 'error');
                return;
            }
            
            try {
                await Auth.register({
                    first_name: document.getElementById('reg-first-name').value,
                    last_name: document.getElementById('reg-last-name').value,
                    email: document.getElementById('reg-email').value,
                    phone_number: document.getElementById('reg-phone').value,
                    password: pass,
                    password_confirm: confirm
                });
                window.location.href = '/';
            } catch (err) {
                UI.showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
