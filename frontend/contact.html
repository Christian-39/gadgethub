<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo"><svg class="logo-svg" width="140" height="26" viewBox="0 0 150 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GadgetHub"><circle cx="8" cy="13" r="5" fill="#7c3aed"/><text x="20" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="currentColor">GadgetHub</text></svg></a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav"><!-- nav-injected --></nav>
    </aside>

    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/" class="mobile-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px;flex-shrink:0"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Contact Us</a>
        </div>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <div id="auth-links"></div>
        </div>
    </header>
    <div class="mobile-search-bar" id="mobile-search-bar">
        <input type="text" id="mobile-search-input" placeholder="Search products...">
        <button id="mobile-search-btn" aria-label="Search">🔍</button>
    </div>

    <main class="main-content">
        <h1>Contact Us</h1>
        <div class="care-grid">
            <div class="care-card">
                <h3>📧 Email</h3>
                <p>support@gadgethub.ng</p>
                <p>business@gadgethub.ng</p>
            </div>
            <div class="care-card">
                <h3>📞 Phone</h3>
                <p>+234 800 123 4567</p>
                <p>+234 800 765 4321</p>
            </div>
            <div class="care-card">
                <h3>🕒 Hours</h3>
                <p>Monday - Friday: 9:00 AM - 6:00 PM WAT</p>
                <p>Saturday: 10:00 AM - 4:00 PM WAT</p>
                <p>Sunday: Closed</p>
            </div>
            <div class="care-card">
                <h3>📍 Address</h3>
                <p>12 Tech Hub Avenue</p>
                <p>Yaba, Lagos, Nigeria</p>
            </div>
        </div>
        
        <div class="care-card" style="margin-top: 24px;">
            <h3>Send a Message</h3>
            <form id="contact-form" class="form-grid">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="contact-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="contact-email" required>
                </div>
                <div class="form-group full">
                    <label>Subject</label>
                    <input type="text" id="contact-subject" required>
                </div>
                <div class="form-group full">
                    <label>Message</label>
                    <textarea id="contact-message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav"><!-- nav-injected --></nav>

    <script type="module">
        import { App } from '/js/core/app.js';
        import { UI } from '/js/core/ui.js';
        App.init();
        
        document.getElementById('contact-form').addEventListener('submit', (e) => {
            e.preventDefault();
            UI.showToast('Message sent! We will reply within 24 hours.', 'success');
            e.target.reset();
        });
    </script>
</body>
</html>
