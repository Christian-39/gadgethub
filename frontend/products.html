<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — GadgetHub</title>
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/frontend/" class="logo">⚡ GadgetHub</a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="/frontend/">🏠 Home</a>
            <a href="/frontend/products.html">🛍️ Products</a>
            <a href="/frontend/categories.html" class="active">📂 Categories</a>
            <a href="/frontend/cart.html">🛒 Cart <span class="badge" data-cart-count>0</span></a>
            <a href="/frontend/wishlist.html">❤️ Wishlist <span class="badge" data-wish-count>0</span></a>
            <a href="/frontend/orders.html">📦 Orders</a>
            <a href="/frontend/wallet.html">💰 Wallet</a>
            <a href="/frontend/profile.html">👤 Profile</a>
            <a href="/frontend/customer-care.html">🎧 Support</a>
        </nav>
        <div class="sidebar-footer">
            <button data-theme-toggle class="theme-toggle">🌓 Theme</button>
        </div></aside>
    
    <header class="main-header">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/frontend/" class="mobile-logo">⚡ GadgetHub</a>
        <div class="header-actions" id="auth-links"></div>
    </header>

    <main class="main-content">
        <div class="products-page">
            <aside class="filters-panel">
                <h3>Filters</h3>
                <div class="filter-group">
                    <label>Category</label>
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <option value="gadgets">Gadgets</option>
                        <option value="outfits">Fashion</option>
                        <option value="jewelry">Jewelry</option>
                        <option value="cars-car-parts">Auto</option>
                        <option value="tools">Tools</option>
                        <option value="kids-accessories">Kids</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <div class="price-inputs">
                        <input type="number" id="min-price" placeholder="Min ₦" min="0">
                        <input type="number" id="max-price" placeholder="Max ₦" min="0">
                    </div>
                </div>
                <div class="filter-group">
                    <label>Sort By</label>
                    <select id="sort-filter">
                        <option value="1">Featured</option>
                        <option value="2">Best Selling</option>
                        <option value="3">Name A-Z</option>
                        <option value="5">Price Low-High</option>
                        <option value="6">Price High-Low</option>
                        <option value="8">Newest</option>
                    </select>
                </div>
            </aside>

            <div class="products-content">
                <div class="products-toolbar">
                    <h1>Products</h1>
                    <div class="view-toggle">
                        <button id="grid-view" class="active">⊞ Grid</button>
                        <button id="list-view">☰ List</button>
                    </div>
                </div>
                <div id="products-grid" class="products-grid">
                    <!-- JS populated -->
                </div>
                <div id="pagination" class="pagination-container">
                    <!-- JS populated -->
                </div>
            </div>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="/frontend/">🏠<span>Home</span></a>
        <a href="/frontend/categories.html" class="active">📂<span>Categories</span></a>
        <a href="/frontend/cart.html">🛒<span>Cart</span><span class="badge" data-cart-count>0</span></a>
        <a href="/frontend/wishlist.html">❤️<span>Wishlist</span><span class="badge" data-wish-count>0</span></a>
        <a href="/frontend/profile.html">👤<span>Profile</span></a>
    </nav

    <script type="module" src="/frontend/js/core/app.js"></script>
    <script type="module">
        import { App } from '/frontend/js/core/app.js';
        import { ProductsPage } from '/frontend/js/pages/products.js';
        App.init().then(() => ProductsPage.init());
    </script>
</body>
</html>
