<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo">⚡ GadgetHub</a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav">
            <a href="/">🏠 Home</a>
            <a href="/products.html" class="active">🛍️ Products</a>
            <a href="/categories.html">📂 Categories</a>
            <a href="/cart.html">🛒 Cart <span class="badge" data-cart-count>0</span></a>
            <a href="/wishlist.html">❤️ Wishlist <span class="badge" data-wish-count>0</span></a>
            <a href="/orders.html">📦 Orders</a>
            <a href="/wallet.html">💰 Wallet</a>
            <a href="/profile.html">👤 Profile</a>
            <a href="/customer-care.html">🎧 Support</a>
        </nav></aside>
    
    <header class="main-header">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/" class="mobile-logo">⚡ Products</a>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <div id="auth-links"></div>
        </div>
    </header>

    <main class="main-content">
        <div class="products-page">
            <aside class="filters-panel">
                <h3>Filters</h3>
                <div class="filter-group">
                    <label>Category</label>
                    <select id="category-filter">
                        <option value="all">All Categories</option>
                        <!-- JS populated from Payuee's category taxonomy -->
                    </select>
                </div>
                <div class="filter-group">
                    <label>Price Range</label>
                    <div class="price-inputs">
                        <input type="number" id="min-price" placeholder="Min ₦" min="0">
                        <input type="number" id="max-price" placeholder="Max ₦" min="0">
                    </div>
                </div>
                <div class="filter-group">
                    <label>Sort By</label>
                    <select id="sort-filter">
                        <option value="1">Featured</option>
                        <option value="2">Best Selling</option>
                        <option value="3">Name A-Z</option>
                        <option value="5">Price Low-High</option>
                        <option value="6">Price High-Low</option>
                        <option value="8">Newest</option>
                    </select>
                </div>
            </aside>

            <div class="products-content">
                <div class="products-toolbar">
                    <h1>Products</h1>
                    <div class="view-toggle">
                        <button id="grid-view" class="active">⊞ Grid</button>
                        <button id="list-view">☰ List</button>
                    </div>
                </div>
                <div id="products-grid" class="products-grid">
                    <!-- JS populated -->
                </div>
                <div id="pagination" class="pagination-container">
                    <!-- JS populated -->
                </div>
            </div>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="/">🏠<span>Home</span></a>
        <a href="/categories.html">📂<span>Categories</span></a>
        <a href="/cart.html">🛒<span>Cart</span><span class="badge" data-cart-count>0</span></a>
        <a href="/wishlist.html">❤️<span>Wishlist</span><span class="badge" data-wish-count>0</span></a>
        <a href="/profile.html">👤<span>Profile</span></a>
    </nav

    <script type="module" src="/js/core/app.js"></script>
    <script type="module">
        import { App } from '/js/core/app.js';
        import { ProductsPage } from '/js/pages/products.js';
        App.init().then(() => ProductsPage.init());
    </script>
</body>
</html>
