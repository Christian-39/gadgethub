<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GadgetHub — Premium E-Commerce</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    
    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo">
  <svg class="logo-svg" width="140" height="26" viewBox="0 0 150 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GadgetHub">
    <path d="M4 9h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9z" fill="#7c3aed"/>
    <path d="M8 9V7a4 4 0 0 1 8 0v2" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M13 11l-3 4h3l-1 4 5-5h-3l2-3z" fill="white"/>
    <text x="26" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="currentColor">GadgetHub</text>
  </svg>
</a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav"><!-- nav-injected --></nav>
    </aside>

    <!-- Header -->
    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/" class="mobile-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px;flex-shrink:0"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> Home</a>
        </div>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <div id="auth-links"></div>
        </div>
    </header>
    <div class="mobile-search-bar" id="mobile-search-bar">
        <input type="text" id="mobile-search-input" placeholder="Search products...">
        <button id="mobile-search-btn" aria-label="Search">🔍</button>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero -->
        <section class="hero">
            <div class="hero-content">
                <h1>Discover Premium Gadgets</h1>
                <p>Escrow-protected shopping with secure delivery across Nigeria</p>
                <a href="/products.html" class="btn-primary btn-large">Shop Now</a>
            </div>
        </section>

        <!-- Categories -->
        <section class="section">
            <h2>Shop by Category</h2>
            <div class="categories-grid" id="categories">
                <!-- JS populated -->
            </div>
        </section>

        <!-- Featured -->
        <section class="section">
            <div class="section-header">
                <h2>Featured Products</h2>
                <a href="/products.html?sort=1" class="btn-text">View All →</a>
            </div>
            <div class="products-grid" id="featured-products">
                <!-- JS populated -->
            </div>
        </section>

        <!-- Best Sellers -->
        <section class="section">
            <div class="section-header">
                <h2>Best Sellers</h2>
                <a href="/products.html?sort=2" class="btn-text">View All →</a>
            </div>
            <div class="products-grid" id="best-sellers">
                <!-- JS populated -->
            </div>
        </section>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav"><!-- nav-injected --></nav>

    <script type="module" src="/js/core/app.js"></script>
    <script type="module">
        import { App } from '/js/core/app.js';
        import { HomePage } from '/js/pages/home.js';
        App.init().then(() => HomePage.init());
    </script>
</body>
</html>
