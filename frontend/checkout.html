<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar"><div class="sidebar-header">
            <a href="/" class="logo"><svg class="logo-svg" width="140" height="26" viewBox="0 0 150 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GadgetHub"><circle cx="8" cy="13" r="5" fill="#7c3aed"/><text x="20" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="currentColor">GadgetHub</text></svg></a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav"><!-- nav-injected --></nav></aside>
    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/" class="mobile-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px;flex-shrink:0"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Checkout</a>
        </div>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <div id="auth-links"></div>
        </div>
    </header>
    <div class="mobile-search-bar" id="mobile-search-bar">
        <input type="text" id="mobile-search-input" placeholder="Search products...">
        <button id="mobile-search-btn" aria-label="Search">🔍</button>
    </div>

    <main class="main-content">
        <h1>Checkout</h1>
        <div class="checkout-layout">
            <div class="checkout-main">
                <section class="checkout-section">
                    <h3>📍 Delivery Address</h3>
                    <div id="address-list" class="address-list">
                        <!-- JS populated -->
                    </div>
                </section>
                
                <section class="checkout-section">
                    <h3>🔒 Transaction PIN</h3>
                    <p>Enter your 6-digit PIN to authorize this order</p>
                    <input type="password" id="trans-code" maxlength="6" placeholder="******" class="pin-input">
                </section>
            </div>
            
            <aside class="checkout-summary">
                <h3>Order Summary</h3>
                <div id="checkout-items" class="checkout-items">
                    <!-- JS populated -->
                </div>
                <div class="summary-totals">
                    <div class="summary-row"><span>Subtotal</span><span id="checkout-subtotal">₦0.00</span></div>
                    <div class="summary-row"><span>Shipping</span><span id="checkout-shipping">Calculating...</span></div>
                    <div id="shipping-breakdown" class="shipping-breakdown"></div>
                    <div class="summary-row total"><span>Total</span><span id="checkout-total">₦0.00</span></div>
                </div>
                <button id="place-order" class="btn-primary btn-large btn-full">Place Order</button>
            </aside>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav"><!-- nav-injected --></nav>

    <script type="module" src="/js/core/app.js"></script>
    <script type="module">
        import { App } from '/js/core/app.js';
        import { CheckoutPage } from '/js/pages/checkout.js';
        App.init().then(() => CheckoutPage.init());
    </script>
</body>
</html>
