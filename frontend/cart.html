<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar"><div class="sidebar-header">
            <a href="/" class="logo">
  <svg class="logo-svg" width="140" height="26" viewBox="0 0 150 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GadgetHub">
    <path d="M4 9h16v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9z" fill="#7c3aed"/>
    <path d="M8 9V7a4 4 0 0 1 8 0v2" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M13 11l-3 4h3l-1 4 5-5h-3l2-3z" fill="white"/>
    <text x="26" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="currentColor">GadgetHub</text>
  </svg>
</a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav"><!-- nav-injected --></nav>
    </aside>
    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
</button>
        <a href="/" class="mobile-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-right:6px;flex-shrink:0"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Cart</a>
        </div>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button
            class="theme-toggle"
            data-theme-toggle
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            <svg
                class="theme-icon theme-icon-sun"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>

            <svg
                class="theme-icon theme-icon-moon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1-9-9Z"></path>
            </svg>
        </button>
            <div id="auth-links"></div>
        </div>
    </header>
    <div class="mobile-search-bar" id="mobile-search-bar">
        <input type="text" id="mobile-search-input" placeholder="Search products...">
        <button id="mobile-search-btn" aria-label="Search">🔍</button>
    </div>

    <main class="main-content">
        <h1>Shopping Cart</h1>
        <div class="cart-layout">
            <div id="cart-items" class="cart-items">
                <!-- JS populated -->
            </div>
            <aside id="cart-summary" class="cart-summary">
                <!-- JS populated -->
            </aside>
        </div>
    </main>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-nav"><!-- nav-injected --></nav>

    <script type="module" src="/js/core/app.js"></script>
    <script type="module">
        import { App } from '/js/core/app.js';
        import { CartPage } from '/js/pages/cart.js';
        App.init().then(() => CartPage.init());
    </script>
</body>
</html>
