<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar"><div class="sidebar-header">
            <a href="/" class="logo"><svg class="logo-svg" width="140" height="26" viewBox="0 0 150 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GadgetHub"><circle cx="8" cy="13" r="5" fill="#7c3aed"/><text x="20" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="currentColor">GadgetHub</text></svg></a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav">
            <a href="/">🏠 Home</a>
            <a href="/products.html">🛍️ Products</a>
            <a href="/categories.html">📂 Categories</a>
            <a href="/cart.html" class="active">🛒 Cart <span class="badge" data-cart-count>0</span></a>
            <a href="/wishlist.html">❤️ Wishlist <span class="badge" data-wish-count>0</span></a>
            <a href="/orders.html">📦 Orders</a>
            <a href="/wallet.html">💰 Wallet</a>
            <a href="/profile.html">👤 Profile</a>
            <a href="/customer-care.html">🎧 Support</a>
        </nav>
    </aside>
    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/" class="mobile-logo">⚡ Cart</a>
        </div>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <div id="auth-links"></div>
        </div>
    </header>
    <div class="mobile-search-bar" id="mobile-search-bar">
        <input type="text" id="mobile-search-input" placeholder="Search products...">
        <button id="mobile-search-btn" aria-label="Search">🔍</button>
    </div>

    <main class="main-content">
        <h1>Shopping Cart</h1>
        <div class="cart-layout">
            <div id="cart-items" class="cart-items">
                <!-- JS populated -->
            </div>
            <aside id="cart-summary" class="cart-summary">
                <!-- JS populated -->
            </aside>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="/">🏠<span>Home</span></a>
        <a href="/categories.html">📂<span>Categories</span></a>
        <a href="/cart.html" class="active">🛒<span>Cart</span><span class="badge" data-cart-count>0</span></a>
        <a href="#" id="bottom-search-trigger">🔍<span>Search</span></a>
        <a href="/profile.html">👤<span>Profile</span></a>
    </nav

    <script type="module" src="/js/core/app.js"></script>
    <script type="module">
        import { App } from '/js/core/app.js';
        import { CartPage } from '/js/pages/cart.js';
        App.init().then(() => CartPage.init());
    </script>
</body>
</html>
