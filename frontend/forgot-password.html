<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — GadgetHub</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="/" class="auth-logo">⚡ GadgetHub</a>
        <h2>Reset Password</h2>
        <p>Enter your email and we'll send you a reset link</p>
        
        <form id="forgot-form" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="forgot-email" required placeholder="you@example.com">
            </div>
            <button type="submit" class="btn-primary btn-large btn-full">Send Reset Link</button>
        </form>
        
        <div class="auth-links">
            <a href="/login.html">← Back to Login</a>
        </div>
    </div>

    <script type="module">
        import { API } from '/js/core/api.js';
        import { UI } from '/js/core/ui.js';
        
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await API.post('/auth/forgot-password/', {
                    email: document.getElementById('forgot-email').value
                });
                UI.showToast('If this email exists, a reset link has been sent.', 'success');
            } catch (err) {
                UI.showToast('If this email exists, a reset link has been sent.', 'success');
            }
        });
    </script>
</body>
</html>
