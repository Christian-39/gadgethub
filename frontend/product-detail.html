<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>

    <link rel="stylesheet" href="/css/main.css">

<body>

    <aside class="sidebar" id="sidebar">[Same sidebar]</aside>

        <a href="/" class="mobile-logo">⚡ GadgetHub</a>

        <section class="section">
            <h2>Customer Reviews</h2>
            <div id="reviews-section">
                <!-- JS populated -->
            </div>
        </section>

    <nav class="mobile-nav">[Same as index]</nav>
    
    <script type="module">
        import { App } from '/js/core/app.js';
        import { ProductDetailPage } from '/js/pages/product-detail.js';
        App.init().then(() => ProductDetailPage.init());
