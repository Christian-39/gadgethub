<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — GadgetHub</title>
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/dark-mode.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="/frontend/" class="auth-logo">⚡ GadgetHub</a>
        <h2>Welcome Back</h2>
        <p>Sign in to continue shopping</p>
        
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary btn-large btn-full">Sign In</button>
        </form>
        
        <div class="auth-links">
            <a href="/frontend/forgot-password.html">Forgot password?</a>
            <span>•</span>
            <a href="/frontend/register.html">Create account</a>
        </div>
    </div>

    <script type="module">
        import { API } from '/frontend/js/core/api.js';
        import { Auth } from '/frontend/js/core/auth.js';
        import { UI } from '/frontend/js/core/ui.js';
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await Auth.login(
                    document.getElementById('login-email').value,
                    document.getElementById('login-password').value
                );
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get('redirect') || '/';
            } catch (err) {
                UI.showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
