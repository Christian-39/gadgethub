<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="/" class="auth-logo"><svg class="logo-svg" width="140" height="26" viewBox="0 0 150 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GadgetHub"><circle cx="8" cy="13" r="5" fill="#7c3aed"/><text x="20" y="19" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" fill="currentColor">GadgetHub</text></svg></a>
        <h2>Welcome Back</h2>
        <p>Sign in to continue shopping</p>
        
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="login-email" required placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary btn-large btn-full">Sign In</button>
        </form>
        
        <div class="auth-links">
            <a href="/forgot-password.html">Forgot password?</a>
            <span>•</span>
            <a href="/register.html">Create account</a>
        </div>
    </div>

    <script type="module">
        import { API } from '/js/core/api.js';
        import { Auth } from '/js/core/auth.js';
        import { UI } from '/js/core/ui.js';
        
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await Auth.login(
                    document.getElementById('login-email').value,
                    document.getElementById('login-password').value
                );
                const params = new URLSearchParams(window.location.search);
                window.location.href = params.get('redirect') || '/';
            } catch (err) {
                UI.showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
