<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — GadgetHub</title>
        <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme') || 'system';
                var mode = saved === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : saved;
                document.documentElement.setAttribute('data-theme', mode);
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/" class="logo">⚡ GadgetHub</a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <div class="sidebar-user" id="sidebar-user"></div>
        <nav class="sidebar-nav">
            <a href="/">🏠 Home</a>
            <a href="/products.html">🛍️ Products</a>
            <a href="/categories.html" class="active">📂 Categories</a>
            <a href="/cart.html">🛒 Cart <span class="badge" data-cart-count>0</span></a>
            <a href="/wishlist.html">❤️ Wishlist <span class="badge" data-wish-count>0</span></a>
            <a href="/orders.html">📦 Orders</a>
            <a href="/wallet.html">💰 Wallet</a>
            <a href="/profile.html">👤 Profile</a>
            <a href="/customer-care.html">🎧 Support</a>
        </nav>
    </aside>

    <header class="main-header">
        <div class="header-left">
            <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/" class="mobile-logo">⚡ Categories</a>
        </div>
        <div class="search-bar">
            <input type="text" id="global-search" placeholder="Search products...">
            <button id="global-search-btn" aria-label="Search">🔍</button>
        </div>
        <div class="header-actions">
            <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme">🌓</button>
            <div id="auth-links"></div>
        </div>
    </header>

    <main class="main-content">
        <h1>All Categories</h1>
        <div class="categories-grid" id="all-categories">
            <!-- JS populated -->
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="/">🏠<span>Home</span></a>
        <a href="/categories.html" class="active">📂<span>Categories</span></a>
        <a href="/cart.html">🛒<span>Cart</span><span class="badge" data-cart-count>0</span></a>
        <a href="/wishlist.html">❤️<span>Wishlist</span><span class="badge" data-wish-count>0</span></a>
        <a href="/profile.html">👤<span>Profile</span></a>
    </nav>

    <script type="module">
        import { App } from '/js/core/app.js';
        import { API } from '/js/core/api.js';

        async function loadAllCategories() {
            const container = document.getElementById('all-categories');
            try {
                const data = await API.get('/products/categories/');
                const categories = data.success || [];
                container.innerHTML = categories.map(c => `
                    <a href="/products.html?category=${c.id}" class="category-card" style="padding: 40px;">
                        <span class="cat-icon" style="font-size: 3rem;">${c.icon}</span>
                        <span class="cat-name" style="font-size: 1.2rem;">${c.name}</span>
                    </a>
                `).join('');
            } catch (e) {
                container.innerHTML = '<p class="error">Failed to load categories</p>';
            }
        }

        App.init().then(loadAllCategories);
    </script>
</body>
</html>
