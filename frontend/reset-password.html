<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — GadgetHub</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dark-mode.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="/" class="auth-logo">⚡ GadgetHub</a>
        <h2>Create New Password</h2>
        <p>Enter your new password below</p>
        
        <form id="reset-form" class="auth-form">
            <input type="hidden" id="reset-token">
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="reset-password" required minlength="8" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="reset-confirm" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary btn-large btn-full">Reset Password</button>
        </form>
        
        <div class="auth-links">
            <a href="/login.html">← Back to Login</a>
        </div>
    </div>

    <script type="module">
        import { API } from '/js/core/api.js';
        import { UI } from '/js/core/ui.js';
        
        const params = new URLSearchParams(window.location.search);
        document.getElementById('reset-token').value = params.get('token') || '';
        
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('reset-password').value;
            const confirm = document.getElementById('reset-confirm').value;
            
            if (pass !== confirm) {
                UI.showToast('Passwords do not match', 'error');
                return;
            }
            
            try {
                await API.post('/auth/reset-password/', {
                    token: document.getElementById('reset-token').value,
                    new_password: pass
                });
                UI.showToast('Password reset successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = '/login.html', 2000);
            } catch (err) {
                UI.showToast(err.message || 'Invalid or expired token', 'error');
            }
        });
    </script>
</body>
</html>
