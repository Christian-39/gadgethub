<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet — GadgetHub</title>
    <link rel="stylesheet" href="/frontend/css/main.css">
    <link rel="stylesheet" href="/frontend/css/dark-mode.css">
</head>
<body>
    <div id="overlay" class="overlay"></div>
    <aside class="sidebar" id="sidebar"><div class="sidebar-header">
            <a href="/frontend/" class="logo">⚡ GadgetHub</a>
            <button class="close-sidebar" id="close-sidebar">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="/frontend/">🏠 Home</a>
            <a href="/frontend/products.html">🛍️ Products</a>
            <a href="/frontend/categories.html" class="active">📂 Categories</a>
            <a href="/frontend/cart.html">🛒 Cart <span class="badge" data-cart-count>0</span></a>
            <a href="/frontend/wishlist.html">❤️ Wishlist <span class="badge" data-wish-count>0</span></a>
            <a href="/frontend/orders.html">📦 Orders</a>
            <a href="/frontend/wallet.html">💰 Wallet</a>
            <a href="/frontend/profile.html">👤 Profile</a>
            <a href="/frontend/customer-care.html">🎧 Support</a>
        </nav>
        <div class="sidebar-footer">
            <button data-theme-toggle class="theme-toggle">🌓 Theme</button>
        </div></aside>
    <header class="main-header">
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <a href="/frontend/" class="mobile-logo">⚡ GadgetHub</a>
    </header>

    <main class="main-content">
        <h1>My Wallet</h1>
        
        <div class="wallet-header">
            <div class="balance-card">
                <p class="balance-label">Available Balance</p>
                <h2 id="wallet-balance" class="balance-amount">₦0.00</h2>
                <p class="balance-note">Funds are held in escrow until delivery is confirmed</p>
            </div>
            <div id="funding-details" class="funding-details">
                <!-- JS populated -->
            </div>
        </div>

        <div class="transactions-section">
            <div class="transactions-header">
                <h3>Transaction History</h3>
                <div class="transaction-filters">
                    <select id="tx-type">
                        <option value="">All Types</option>
                        <option value="credit">Credits</option>
                        <option value="debit">Debits</option>
                        <option value="escrow_lock">Escrow</option>
                        <option value="refund">Refunds</option>
                    </select>
                    <input type="text" id="tx-search" placeholder="Search transactions...">
                    <input type="date" id="tx-start">
                    <input type="date" id="tx-end">
                </div>
            </div>
            <div id="transactions-list" class="transactions-list">
                <!-- JS populated -->
            </div>
        </div>
    </main>

    <nav class="mobile-nav">
        <a href="/frontend/">🏠<span>Home</span></a>
        <a href="/frontend/categories.html" class="active">📂<span>Categories</span></a>
        <a href="/frontend/cart.html">🛒<span>Cart</span><span class="badge" data-cart-count>0</span></a>
        <a href="/frontend/wishlist.html">❤️<span>Wishlist</span><span class="badge" data-wish-count>0</span></a>
        <a href="/frontend/profile.html">👤<span>Profile</span></a>
    </nav

    <script type="module" src="/frontend/js/core/app.js"></script>
    <script type="module">
        import { App } from '/frontend/js/core/app.js';
        import { WalletPage } from '/frontend/js/pages/wallet.js';
        App.init().then(() => WalletPage.init());
    </script>
</body>
</html>
