services:
  - type: web
    name: gadgethub-api
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn gadgethub.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --threads 2

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "gadgethub-api.onrender.com"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://gadgethub.vercel.app"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gadgethub.vercel.app"

      - key: DATABASE_URL
        sync: false

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gadgethub-redis
          property: connectionString

  - type: keyvalue
    name: gadgethub-redis
    plan: free
    ipAllowList: []